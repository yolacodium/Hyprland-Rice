source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Uhrzeit
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 96
    font_family = monospace
    position = 0, 160
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    color = $primary
    font_size = 22
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    placeholder_text = <i>Passwort...</i>
    rounding = 16
    position = 0, -40
    halign = center
    valign = center
}
